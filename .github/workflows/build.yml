name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar herramientas
        run: brew install xcodegen ldid
      - name: Generar proyecto
        run: xcodegen generate
      - name: Compilar sin firmar
        run: |
          set -o pipefail
          set +e
          xcodebuild -project Deporte.xcodeproj -scheme Deporte \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          RES=$?
          if [ $RES -ne 0 ]; then
            grep -E "error:" build.log | sort -u | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            tail -30 build.log
            exit $RES
          fi
      - name: Entitlements (grupo de datos del widget)
        run: |
          APP=build/Build/Products/Release-iphoneos/Deporte.app
          ldid -SEntitlements/App.entitlements $APP/Deporte
          ldid -SEntitlements/Widget.entitlements $APP/PlugIns/DeporteWidget.appex/DeporteWidget
      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Deporte.app Payload/
          zip -r Deporte.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Deporte-ipa
          path: Deporte.ipa
